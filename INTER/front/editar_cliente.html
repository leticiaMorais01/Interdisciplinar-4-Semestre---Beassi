<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar cliente | BEASSI Arquitetura</title>

    <link rel="icon" href="Imagens/mini_logo_verde.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="Css/style.css">
    <link rel="stylesheet" href="Css/perfil_cliente.css">
</head>

<body>

    <header class="perfil-header">

        <a href="index.html">
            <img src="Imagens/logo_bege.png" alt="BEASSI Arquitetura">
        </a>

        <nav>
            <a href="painel_admin.html">PAINEL ADMINISTRATIVO</a>
            <a href="login.html">SAIR</a>
        </nav>

    </header>

    <main class="perfil-main" id="conteudo-principal">

        <a class="perfil-voltar" href="gerenciar_clientes.html">
            <i class="fa-solid fa-arrow-left"></i>
            Voltar aos clientes
        </a>

        <section class="perfil-intro">

            <span>ÁREA ADMINISTRATIVA</span>

            <h1>Editar cliente</h1>

            <p>
                Atualize os dados cadastrais. A senha não fica disponível para visualização ou edição.
            </p>

        </section>

        <form class="perfil-form" id="formEditarAdmin">

            <label>
                Nome completo
                <input name="nome" type="text" required>
            </label>

            <label>
                E-mail
                <input name="email" type="email" required>
            </label>

            <label>
                CPF
                <input name="cpf" type="text" readonly required>
            </label>

            <label>
                Telefone
                <input name="telefone" type="tel" required maxlength="15" inputmode="tel">
            </label>


            <div class="perfil-form-acoes">

                <a href="gerenciar_clientes.html">Cancelar</a>

                <button type="submit">Salvar alterações</button>

            </div>

            <p class="perfil-form-aviso" id="avisoEdicao" role="status">
                As alterações serão salvas no cadastro do cliente.
            </p>

        </form>

    </main>

    <script src="Js/api.js"></script>
    <script src="Js/integracao_dinamica.js"></script>
    <script src="Js/formularios_perfil.js"></script>
    <script src="Js/script.js"></script>

</body>

</html>
