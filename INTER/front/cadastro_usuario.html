
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="Css/cadastro_usuario.css">

    <link href="Imagens/mini_logo_verde.png" rel="icon">
</head>

<body>

    <div class="container">

        <div class="cadastro-box">

            <!-- LADO ESQUERDO -->

            <div class="welcome-section">

                <div class="overlay">

                    <h1>Bem-vindo!</h1>

                    <p>
                        Já possui uma conta?<br>
                        Entre para acompanhar seus projetos.
                    </p>

                    <a href="login.html" class="btn-login">
                        ENTRAR
                    </a>

                </div>

            </div>

            <!-- FORMULÁRIO -->

            <div class="form-section">

                <a href="index.html" class="logo-home" aria-label="Ir para a página inicial da BEASSI">
                    <img src="Imagens/logo_verde.png" alt="BEASSI Arquitetura - página inicial" class="logo-cadastro">
                </a>

                <h2>Criar Conta</h2>

                <form action="#" method="POST" data-validar-senha data-cadastro-cliente>

                    <!-- NOME -->

                    <div class="campo-formulario">
                        <label for="nome">Nome completo</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <!-- E-MAIL -->

                    <div class="campo-formulario">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <!-- CPF -->

                    <div class="campo-formulario">
                        <label for="cpf">CPF</label>
                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            inputmode="numeric"
                            maxlength="14"
                            autocomplete="off"
                            required
                        >
                    </div>

                    <!-- TELEFONE -->

                    <div class="campo-formulario">
                        <label for="telefone">Telefone / WhatsApp</label>
                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(00) 00000-0000"
                            inputmode="tel"
                            maxlength="15"
                            autocomplete="tel"
                            required
                        >
                    </div>

                    <!-- SENHA -->

                    <div class="campo-formulario">
                        <label for="senha">Senha</label>

                        <div class="campo-senha">
                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Mínimo de 8 caracteres"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-senha"
                                data-toggle-senha
                                aria-label="Mostrar senha"
                                aria-pressed="false"
                            >
                                <i class="fa-regular fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <!-- CONFIRMAR SENHA -->

                    <div class="campo-formulario">
                        <label for="confirmarSenha">Confirmar senha</label>

                        <div class="campo-senha">
                            <input
                                type="password"
                                id="confirmarSenha"
                                name="confirmarSenha"
                                placeholder="Digite sua senha novamente"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-senha"
                                data-toggle-senha
                                aria-label="Mostrar senha"
                                aria-pressed="false"
                            >
                                <i class="fa-regular fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <!-- CADASTRAR -->

                    <button type="submit">
                        CADASTRAR
                    </button>

                </form>

                <a href="index.html" class="btn-voltar-inicio">
                    <i class="fa-solid fa-arrow-left"></i>
                    VOLTAR À PÁGINA INICIAL
                </a>

            </div>

        </div>

    </div>

    <script src="Js/api.js"></script>
    <script src="Js/integracao_dinamica.js"></script>
    <script src="Js/script.js"></script>

</body>
</html>
