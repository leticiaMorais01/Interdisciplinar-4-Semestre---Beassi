<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do administrador | BEASSI Arquitetura</title>
  <link rel="icon" href="Imagens/mini_logo_verde.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="Css/style.css">
  <link rel="stylesheet" href="Css/perfil_cliente.css">
</head>
<body>
  <header class="perfil-header">
    <a href="painel_admin.html"><img src="Imagens/logo_bege.png" alt="BEASSI Arquitetura"></a>
    <nav><a href="painel_admin.html">PAINEL ADMINISTRATIVO</a><a href="login.html">SAIR</a></nav>
  </header>
  <main class="perfil-main" id="conteudo-principal">
    <a class="perfil-voltar" href="painel_admin.html"><i class="fa-solid fa-arrow-left"></i> Voltar ao painel</a>
    <section class="perfil-intro">
      <span>CONTA ADMINISTRATIVA</span>
      <h1>Editar perfil</h1>
      <p>Atualize os dados de acesso e o registro profissional do administrador.</p>
    </section>
    <form class="perfil-form" id="formEditarAdministrador">
      <label>E-mail
        <input name="email" type="email" autocomplete="email" placeholder="admin@beassi.com" required>
      </label>
      <label>Registro CAU
        <input name="registroCau" type="text" maxlength="20" placeholder="CAU-SP-000001" required>
      </label>
      <div class="perfil-form-separador">
        <h2>Segurança</h2>
        <p>Para alterar a senha, utilize o processo de recuperação de senha.</p>
        <a href="recuperar_senha.html">Solicitar redefinição de senha</a>
      </div>
      <div class="perfil-form-acoes">
        <a href="painel_admin.html">Cancelar</a>
        <button type="submit">Salvar alterações</button>
      </div>
      
    </form>
  </main>
  <script src="Js/api.js"></script>
    <script src="Js/integracao_dinamica.js"></script>
    <script src="Js/formularios_perfil.js"></script>
  <script src="Js/script.js"></script>
</body>
</html>
